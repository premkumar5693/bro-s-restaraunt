<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | The Bro's Feast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="font-inter text-custom-charcoal min-h-screen flex bg-white selection:bg-custom-orange selection:text-white">

  <!-- Left Side: Hero Image (Hidden on Mobile) -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-gray-900 overflow-hidden">
    <!-- Using a complementary image for register -->
    <img src="https://images.unsplash.com/photo-1544148103-0773bf10d330?auto=format&fit=crop&q=80&w=2000" 
         class="absolute inset-0 w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-[20s] ease-out" 
         alt="Restaurant Ambiance" />
    
    <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-black/10"></div>
    
    <div class="absolute bottom-0 left-0 right-0 p-16 xl:p-20 z-10 text-white animate-fade-up">
      <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full mb-6 border border-white/30 text-sm font-semibold tracking-wide">
        <i class="ph-fill ph-lock-key text-custom-yellow"></i>
        <span>Account Recovery</span>
      </div>
      <h2 class="font-outfit font-black text-5xl xl:text-6xl mb-6 leading-[1.1] tracking-tight text-white drop-shadow-lg">
        Secure your <span class="text-transparent bg-clip-text bg-gradient-to-r from-custom-yellow to-custom-orange whitespace-nowrap">Account.</span>
      </h2>
      <p class="text-lg text-gray-300 font-light max-w-md drop-shadow-md">
        Don't worry! We will help you securely recover your password and get you back to ordering the finest meals.
      </p>
    </div>
  </div>

  <!-- Right Side: Reset Form -->
  <div class="w-full lg:w-1/2 flex flex-col justify-center px-6 sm:px-16 xl:px-32 py-12 relative overflow-y-auto">
    
    <!-- Close / Back Button -->
    <a href="login.html" class="absolute top-6 right-6 sm:top-8 sm:right-8 w-12 h-12 flex items-center justify-center rounded-full bg-gray-50 border border-gray-100 text-gray-400 hover:bg-custom-orange hover:text-white hover:border-custom-orange transition-all shadow-sm hover:shadow-md z-50 group">
      <i class="ph-bold ph-x text-xl group-hover:rotate-90 transition-transform duration-300"></i>
    </a>

    <!-- Mobile background pattern (visible only on mobile) -->
    <div class="lg:hidden absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#FF7700 1px, transparent 1px); background-size: 20px 20px;"></div>

    <div class="w-full max-w-md mx-auto relative z-10">
      <!-- Logo Header -->
      <a href="index.html" class="flex items-center gap-3 mb-10 group w-fit">
        <div class="w-12 h-12 bg-custom-orange rounded-xl flex items-center justify-center text-white shadow-[0_8px_20px_rgba(255,119,0,0.3)] group-hover:-translate-y-1 transition-transform">
          <i class="ph-bold ph-fork-knife text-2xl"></i>
        </div>
        <span class="font-outfit font-black text-2xl tracking-tight text-gray-900 group-hover:text-custom-orange transition-colors">The Bro's Feast</span>
      </a>

      <!-- Welcome Text -->
      <div class="mb-10 animate-fade-up" style="animation-delay: 100ms; animation-fill-mode: both;">
        <h1 class="font-outfit font-black text-4xl text-gray-900 mb-3 tracking-tight" id="header-title">Reset Password</h1>
        <p class="text-gray-500 text-lg" id="header-desc">Enter your registered phone number to receive an OTP.</p>
      </div>

      <!-- Step 1 Form -->
      <form id="step1-form" class="space-y-5 animate-fade-up" style="animation-delay: 200ms; animation-fill-mode: both;">
        
        <div class="space-y-2">
          <label class="font-bold text-sm text-gray-700 block">Phone Number</label>
          <div class="relative group">
            <i class="ph-bold ph-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
            <input type="tel" id="reset-phone" placeholder="9876543210" required 
                   class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 font-medium transition-all hover:border-gray-300" />
          </div>
        </div>

        <button type="submit" class="w-full py-4 mt-2 bg-gradient-to-r from-custom-charcoal to-black text-white rounded-xl font-bold text-lg hover:shadow-xl transition-all active:scale-[0.98] border border-black flex justify-center items-center gap-2 group">
          Send OTP <i class="ph-bold ph-paper-plane-tilt group-hover:-translate-y-1 group-hover:translate-x-1 transition-transform"></i>
        </button>
      </form>


      <!-- Step 2 Form (Hidden initially) -->
      <form id="step2-form" class="space-y-5 animate-fade-up hidden" style="animation-delay: 200ms; animation-fill-mode: both;">
        
        <div class="space-y-2">
          <label class="font-bold text-sm text-gray-700 block">6-Digit OTP</label>
          <div class="relative group">
            <i class="ph-bold ph-chat-teardrop-text absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
            <input type="text" id="reset-otp" placeholder="123456" required maxlength="6"
                   class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 font-medium transition-all tracking-[0.2em] text-center" />
          </div>
        </div>

        <div class="space-y-2">
          <label class="font-bold text-sm text-gray-700 block">New Password</label>
          <div class="relative group">
            <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
            <input type="password" id="reset-newpassword" placeholder="Create new password" required 
                   class="w-full pl-12 pr-12 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 font-medium transition-all hover:border-gray-300" />
            <i onclick="const input = this.previousElementSibling; if(input.type === 'password') { input.type = 'text'; this.classList.replace('ph-eye', 'ph-eye-slash'); } else { input.type = 'password'; this.classList.replace('ph-eye-slash', 'ph-eye'); }" class="ph-bold ph-eye absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600 transition-colors z-10"></i>
          </div>
        </div>

        <button type="submit" class="w-full py-4 mt-4 bg-gradient-to-r from-custom-orange to-[#FF7700] text-white rounded-xl font-bold text-lg hover:shadow-[0_12px_24px_rgba(255,119,0,0.3)] transition-all active:scale-[0.98] border border-orange-500 flex justify-center items-center gap-2 group">
          Reset Password <i class="ph-bold ph-key group-hover:scale-110 transition-transform"></i>
        </button>
      </form>

      <!-- Footer Links -->
      <div class="mt-8 text-center text-gray-500 font-medium animate-fade-up" style="animation-delay: 300ms; animation-fill-mode: both;">
        Remember your password? 
        <a href="login.html" class="text-custom-charcoal font-bold hover:text-custom-orange hover:underline ml-1 transition-colors">Sign in here</a>
      </div>
      
    </div>
  </div>

  <script>
    const API_BASE = (window.VITE_API_URL || (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:3000" : window.location.origin)).replace(/\/$/, '');

    let globalPhone = '';

    // Step 1: Request OTP
    document.getElementById('step1-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phoneInput = document.getElementById('reset-phone');
      globalPhone = phoneInput.value.trim();
      const btn = e.target.querySelector('button[type="submit"]');
      const ogHtml = btn.innerHTML;
      btn.innerHTML = 'Sending...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: globalPhone })
        });
        const data = await res.json();
        
        // MOCK DEV LOGIC: Alert the token directly because we have no real SMS integrated
        if(data.token) {
          alert(`MOCK SMS RECEIVED:\nYour Bro's Feast OTP is: ${data.token}`);
          // Auto-fill for convenience during testing
          document.getElementById('reset-otp').value = data.token;
        }

        // Proceed to Step 2 visually
        document.getElementById('step1-form').classList.add('hidden');
        document.getElementById('step2-form').classList.remove('hidden');
        document.getElementById('header-title').innerText = 'Enter OTP';
        document.getElementById('header-desc').innerText = `We sent a 6-digit code to ${globalPhone}.`;
        
      } catch (err) {
        alert('Server is offline.');
      } finally {
        btn.innerHTML = ogHtml;
        btn.disabled = false;
      }
    });

    // Step 2: Set New Password
    document.getElementById('step2-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const otp = document.getElementById('reset-otp').value.trim();
      const newPassword = document.getElementById('reset-newpassword').value;
      const btn = e.target.querySelector('button[type="submit"]');
      const ogHtml = btn.innerHTML;
      btn.innerHTML = 'Verifying...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: globalPhone, token: otp, newPassword })
        });
        const data = await res.json();
        if(data.success) {
          alert('Password successfully reset! You can now log in.');
          window.location.href = 'login.html';
        } else {
          alert(data.message || 'Invalid OTP');
        }
      } catch (err) {
        alert('Server is offline.');
      } finally {
        btn.innerHTML = ogHtml;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
