<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | The Bro's Feast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="font-inter text-custom-charcoal min-h-screen flex bg-white selection:bg-custom-orange selection:text-white">

  <!-- Left Side: Hero Image (Hidden on Mobile) -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-gray-900 overflow-hidden">
    <!-- Using a complementary image for register -->
    <img src="https://images.unsplash.com/photo-1544148103-0773bf10d330?auto=format&fit=crop&q=80&w=2000" 
         class="absolute inset-0 w-full h-full object-cover opacity-90 hover:scale-105 transition-transform duration-[20s] ease-out" 
         alt="Restaurant Ambiance" />
    
    <!-- Sophisticated Gradient Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-black/10"></div>
    
    <div class="absolute bottom-0 left-0 right-0 p-16 xl:p-20 z-10 text-white animate-fade-up">
      <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-md px-4 py-1.5 rounded-full mb-6 border border-white/30 text-sm font-semibold tracking-wide">
        <i class="ph-fill ph-check-circle text-custom-yellow"></i>
        <span>Members Only Perks</span>
      </div>
      <h2 class="font-outfit font-black text-5xl xl:text-6xl mb-6 leading-[1.1] tracking-tight text-white drop-shadow-lg">
        Join the <span class="text-transparent bg-clip-text bg-gradient-to-r from-custom-yellow to-custom-orange whitespace-nowrap">Family.</span>
      </h2>
      <ul class="text-lg text-gray-300 font-light space-y-3 drop-shadow-md">
        <li class="flex items-center gap-3"><i class="ph-bold ph-lightning text-custom-orange"></i> Lightning fast checkouts</li>
        <li class="flex items-center gap-3"><i class="ph-bold ph-moped text-custom-orange"></i> Live order GPS tracking</li>
        <li class="flex items-center gap-3"><i class="ph-bold ph-gift text-custom-orange"></i> Exclusive member-only discounts</li>
      </ul>
    </div>
  </div>

  <!-- Right Side: Registration Form -->
  <div class="w-full lg:w-1/2 flex flex-col justify-center px-6 sm:px-16 xl:px-32 py-12 relative overflow-y-auto">
    
    <!-- Close / Back Button -->
    <a href="index.html" class="absolute top-6 right-6 sm:top-8 sm:right-8 w-12 h-12 flex items-center justify-center rounded-full bg-gray-50 border border-gray-100 text-gray-400 hover:bg-custom-orange hover:text-white hover:border-custom-orange transition-all shadow-sm hover:shadow-md z-50 group">
      <i class="ph-bold ph-x text-xl group-hover:rotate-90 transition-transform duration-300"></i>
    </a>

    <!-- Mobile background pattern (visible only on mobile) -->
    <div class="lg:hidden absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#FF7700 1px, transparent 1px); background-size: 20px 20px;"></div>

    <div class="w-full max-w-md mx-auto relative z-10">
      <!-- Logo Header -->
      <a href="index.html" class="flex items-center gap-3 mb-10 group w-fit">
        <div class="w-12 h-12 bg-custom-orange rounded-xl flex items-center justify-center text-white shadow-[0_8px_20px_rgba(255,119,0,0.3)] group-hover:-translate-y-1 transition-transform">
          <i class="ph-bold ph-fork-knife text-2xl"></i>
        </div>
        <span class="font-outfit font-black text-2xl tracking-tight text-gray-900 group-hover:text-custom-orange transition-colors">The Bro's Feast</span>
      </a>

      <!-- Welcome Text -->
      <div class="mb-10 animate-fade-up" style="animation-delay: 100ms; animation-fill-mode: both;">
        <h1 class="font-outfit font-black text-4xl text-gray-900 mb-3 tracking-tight">Create Account</h1>
        <p class="text-gray-500 text-lg">Sign up in seconds to unlock all features.</p>
      </div>

      <!-- Form -->
      <form id="register-form" class="space-y-5 animate-fade-up" style="animation-delay: 200ms; animation-fill-mode: both;">
        
        <!-- Full Name -->
        <div class="space-y-2">
          <label class="font-bold text-sm text-gray-700 block">Full Name</label>
          <div class="relative group">
            <i class="ph-bold ph-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
            <input type="text" id="reg-name" placeholder="User Name" required 
                   class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 transition-all font-medium hover:border-gray-300" />
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <!-- Mobile -->
          <div class="space-y-2">
            <label class="font-bold text-sm text-gray-700 block">Phone Number</label>
            <div class="relative group">
              <i class="ph-bold ph-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
              <input type="tel" id="reg-phone" placeholder="9876543210" required 
                     class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 transition-all font-medium hover:border-gray-300" />
            </div>
          </div>
          
          <!-- Email -->
          <div class="space-y-2">
            <label class="font-bold text-sm text-gray-700 block text-nowrap">Email <span class="font-normal text-gray-400">(Optional)</span></label>
            <div class="relative group">
              <i class="ph-bold ph-envelope-simple absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
              <input type="email" placeholder="Email" 
                     class="w-full pl-12 pr-4 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 transition-all font-medium hover:border-gray-300" />
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="font-bold text-sm text-gray-700 block">Password</label>
          <div class="relative group">
            <i class="ph-bold ph-lock-key absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg group-focus-within:text-custom-orange transition-colors z-10"></i>
            <input type="password" id="reg-password" placeholder="Create a strong password" required 
                   class="w-full pl-12 pr-12 py-4 bg-gray-50 rounded-xl border border-gray-200 focus:outline-none focus:border-custom-orange focus:ring-4 focus:ring-custom-orange/10 focus:bg-white text-gray-900 placeholder-gray-400 transition-all font-medium hover:border-gray-300" />
            <i onclick="const input = this.previousElementSibling; if(input.type === 'password') { input.type = 'text'; this.classList.replace('ph-eye', 'ph-eye-slash'); } else { input.type = 'password'; this.classList.replace('ph-eye-slash', 'ph-eye'); }" class="ph-bold ph-eye absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 cursor-pointer hover:text-gray-600 transition-colors z-10" title="Reveal Password"></i>
          </div>
        </div>

        <button type="submit" class="w-full py-4 mt-4 bg-gradient-to-r from-custom-orange to-[#FF7700] text-white rounded-xl font-bold text-lg hover:shadow-[0_12px_24px_rgba(255,119,0,0.3)] transition-all active:scale-[0.98] border border-orange-500 flex justify-center items-center gap-2 group">
          Create Account <i class="ph-bold ph-arrow-right group-hover:translate-x-1 transition-transform"></i>
        </button>
      </form>

      <!-- Footer Links -->
      <div class="mt-8 text-center text-gray-500 font-medium animate-fade-up" style="animation-delay: 300ms; animation-fill-mode: both;">
        Already have an account? 
        <a href="login.html" class="text-custom-charcoal font-bold hover:text-custom-orange hover:underline ml-1 transition-colors">Sign in here</a>
      </div>
      
    </div>
  </div>

  <script>
    const API_BASE = (window.VITE_API_URL || (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" ? "http://localhost:3000" : window.location.origin)).replace(/\/$/, '');

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const phone = document.getElementById('reg-phone').value;
      const password = document.getElementById('reg-password').value;
      const btn = e.target.querySelector('button[type="submit"]');
      
      const ogHtml = btn.innerHTML;
      btn.innerHTML = 'Connecting...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_BASE}/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone, password })
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('bros_token', data.token);
          localStorage.setItem('bros_user', JSON.stringify(data.user));
          window.location.href = 'index.html'; // Go to homepage
        } else {
          alert(data.message || 'Registration failed');
        }
      } catch (err) {
        alert('Server is offline. Please try again later.');
      } finally {
        btn.innerHTML = ogHtml;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
